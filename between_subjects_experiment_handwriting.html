<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alphabet Learning Study (PSY300 Lab 7, handwriting condition)</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#1d2330;--mute:#5b6475;--accent:#2f5fd0;--ok:#2e9e5b;--bad:#d64545;--line:#d9dde5}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #app{max-width:820px;margin:0 auto;padding:24px 16px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 30px}
  h2{margin-top:0}
  button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 16px;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);margin-top:18px}
  label{display:block;margin:8px 0}
  .mute{color:var(--mute);font-size:.92em}
  .warn{color:var(--bad)}
  .progress{color:var(--mute);font-size:.85em;text-align:right}
  .target{display:flex;justify-content:center;gap:14px;margin:18px 0;direction:ltr}
  .sym{font-family:"Noto Sans Hebrew","Arial Hebrew","Segoe UI",Arial,sans-serif;font-size:96px;line-height:1.1;direction:ltr;unicode-bidi:isolate}
  .inst{text-align:center;color:var(--mute)}
  .fix{font-size:60px;text-align:center;padding:90px 0;color:var(--mute)}
  .meter{height:12px;background:#e8ebf1;border-radius:6px;overflow:hidden;margin:8px 0}
  .meter>div{height:100%;width:0;background:var(--ok)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:640px){.cols{grid-template-columns:1fr}.card{padding:20px 16px}}
  .wcard,.rrow{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:7px 0;display:flex;align-items:center;gap:10px}
  .wcard{cursor:pointer;user-select:none}
  .wcard.sel{border-color:var(--accent);background:#e8effd;box-shadow:0 0 0 2px var(--accent) inset}
  .wcard b{width:22px;color:var(--mute)}
  .wtxt{font-size:30px;direction:ltr;unicode-bidi:bidi-override;font-family:"Noto Sans Hebrew","Arial Hebrew","Segoe UI",Arial,sans-serif;flex:1}
  .wtxt.plain{unicode-bidi:normal;font-family:inherit;font-size:22px}
  .cnt{color:var(--mute);font-size:.8em}
  .rrow .lbl{flex:1}
  .badges span{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;padding:0 7px;margin-left:3px;font-size:.8em}
  .tog.on{background:#dff4e7;border-color:var(--ok)}
  table.k{border-collapse:collapse}
  table.k td{padding:4px 10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';

/* =====================  CONFIG  ===================== */
const Q = new URLSearchParams(location.search);
const DEBUG = Q.has('debug');                 // ?debug=1 → timers ÷10, mic not required
const T = ms => DEBUG ? Math.max(300, ms/10) : ms;
const CONFIG = {
  audioBase: 'audio/',
  submitUrl: 'https://script.google.com/macros/s/AKfycbzp96TC7DrhjKKNBpIwZK0bcPYYVb6q9LwHksUFnWlI5a-WY6OtYNxTey5KT3uEH1sjvQ/exec',
  proxyUrl: 'https://singular-phoenix-10443e.netlify.app/.netlify/functions/submit'
};

/* =====================  STIMULI  ===================== */
// Alphabet 1 (Law et al., 2018). Phoneme order matches the figure: /ɑ/ /m/ /n/ /t/ /i/ /p/ ("a" stands for /ɑ/)
const P  = ['a','m','n','t','i','p'];
const GL = ['ם','צ','ש','ר','ט','פ'];
const IPA = {a:'/ɑ/',m:'/m/',n:'/n/',t:'/tʃ/',i:'/i/',p:'/p/'};
// Spoken fallback (only used when a recorded .mp3 is missing).
// Each string is spelled so TTS pronounces the bare phoneme sound, not the letter name.
//   a → "ah" (/ɑ/),  i → "ee" (/i/),  m → "muh",  n → "nuh"
//   p → "puh",  t → "cha" (/tʃ/ — matches the voice used in recordings)
const PH_TXT = {m:'muh', n:'nuh', p:'puh', t:'cha', a:'ah', i:'ee'};

// Respell a CVCV word into phonemic syllables separated by spaces so TTS
// says e.g. "pah nee" for 'pani' rather than concatenating letter names.
const RESPELL_C = {m:'m', n:'n', p:'p', t:'ch'};
const RESPELL_V = {a:'ah', i:'ee'};
const respell = w => {
  const parts = [];
  for(let i = 0; i < w.length; i += 2){
    const c = RESPELL_C[w[i]]   || w[i];
    const v = RESPELL_V[w[i+1]] || w[i+1] || '';
    parts.push(c + v);
  }
  return parts.join(' ');
};

// Whole-word training: 6 CVCV pseudowords x 2 = 12 trials. Four of them reappear in the test (practiced items).
const WW_TRAIN = ['pani','mapi','tama','nini','nata','tipi'];
const TEST_PRACTICED = ['pani','mapi','tama','nini'];
const TEST_UNTRAINED = ['pini','pata','mipi','mima','mati','nama','titi','pana','mipa','napa','nima','tati','tima','pina','napi','tita'];

// Practice symbols for demos (not part of the experimental alphabet)
const DEMO_SYMS = ['◆','▲','●','■','★','✚'];

/* =====================  STATE  ===================== */
// This file implements the handwriting condition only.
const S = {
  pid: Q.get('pid') || ('P' + Math.random().toString(36).slice(2,8).toUpperCase()),
  cond: 'hand',
  mapVer: Q.has('map') ? (+Q.get('map') % 6) : Math.floor(Math.random()*6),
  startedAt: new Date().toISOString(),
  trials: [], practice: [], test: null, adherence: null, audio: [], photo: null
};
const g = {};
P.forEach((p,j) => g[p] = GL[(j+S.mapVer)%6]);
const toGlyphs = w => [...w].map(c => g[c]);

/* =====================  DATA LAYER  ===================== */
const _DL = {
  sessionId: (()=>{ try{ return crypto.randomUUID(); }catch(e){ return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16);}); } })(),
  appVersion: 'unknown',
  sessionRecId: null,
  blockRecId: null,
  phases: {},
  lastPhase: 'init',
  tab: { count: 0, ms: 0, _t: null },
  testTab: { count: 0, ms: 0, _t: null },
  _inTest: false
};

document.addEventListener('visibilitychange', ()=>{
  const hidden = document.hidden;
  const now = performance.now();
  [_DL.tab, ...((_DL._inTest)?[_DL.testTab]:[])].forEach(t=>{
    if(hidden){ t._t=now; t.count++; }
    else if(t._t!=null){ t.ms+=now-t._t; t._t=null; }
  });
});

function _logPhase(name){ _DL.phases[name]=new Date().toISOString(); _DL.lastPhase=name; }

async function _atCall(payload){
  try{
    const r=await fetch(CONFIG.proxyUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    return await r.json();
  }catch(e){ console.warn('Airtable call failed:',e); return {}; }
}
async function _atCreate(table,fields){
  const r=await _atCall({op:'create',table,records:[{fields}]});
  return r.ids?.[0]||null;
}
async function _atPatch(table,id,fields){
  if(!id) return;
  await _atCall({op:'patch',table,updates:[{id,fields}]});
}

function _lsStats(trials){
  const ls=trials.filter(t=>t.kind==='ls');
  const sorted=[...ls].sort((a,b)=>a.durationMs-b.durationMs);
  const med=sorted.length?sorted[Math.floor(sorted.length/2)].durationMs:null;
  return {
    ls_n_trials:ls.length,
    ls_n_completed:ls.filter(t=>t.status==='complete').length,
    ls_n_timed_out:ls.filter(t=>t.status==='timeout').length,
    ls_total_exposure_ms:ls.reduce((s,t)=>s+t.durationMs,0),
    ls_mean_duration_ms:ls.length?Math.round(ls.reduce((s,t)=>s+t.durationMs,0)/ls.length):null,
    ls_median_duration_ms:med,
    ls_first_click_pct:null, ls_first_click_pct_b1:null, ls_first_click_pct_b2:null,
    ls_total_incorrect_clicks:0
  };
}

function _wwStats(trials){
  const ww=trials.filter(t=>t.kind==='ww');
  return {
    ww_n_trials:ww.length,
    ww_n_completed:ww.filter(t=>t.status==='complete').length,
    ww_n_timed_out:ww.filter(t=>t.status==='timeout').length,
    ww_total_exposure_ms:ww.reduce((s,t)=>s+t.durationMs,0),
    ww_mean_duration_ms:ww.length?Math.round(ww.reduce((s,t)=>s+t.durationMs,0)/ww.length):null,
    ww_total_slot_corrections:0
  };
}

function _testStats(test, testTab){
  if(!test) return {};
  const per=test.perItem||[], ev=test.events||[];
  const unt=per.filter(x=>x.type==='untrained'), prc=per.filter(x=>x.type==='practiced');
  const plays=ev.filter(e=>e.action==='play');
  const played=new Set(plays.map(e=>e.rec));
  const items=per.map(item=>{
    const wev=ev.filter(e=>e.word===item.word);
    const selEvents=wev.filter(e=>e.action==='select-word');
    const matchEvents=wev.filter(e=>e.action==='match');
    const firstSelectedMs=selEvents.length?selEvents[0].t:null;
    const finalMatchMs=matchEvents.length?matchEvents[matchEvents.length-1].t:null;
    const itemRtMs=(firstSelectedMs!==null&&finalMatchMs!==null)?finalMatchMs-firstSelectedMs:null;
    return {
      item_id:item.word, item_type:item.type,
      exact_correct:item.correct,
      selected_recordings:item.selectedRecordings,
      correct_recording_ids:[item.word],
      hits:item.selectedRecordings.includes(item.word)?1:0,
      false_alarms:item.selectedRecordings.filter(r=>r!==item.word).length,
      misses:item.selectedRecordings.includes(item.word)?0:1,
      n_selections:item.selectedRecordings.length,
      n_plays:plays.filter(p=>p.rec===item.word).length,
      first_selected_ms:firstSelectedMs,
      final_match_ms:finalMatchMs,
      item_rt_ms:itemRtMs
    };
  });
  const rtVals=items.map(x=>x.item_rt_ms).filter(x=>x!==null);
  const meanItemRtMs=rtVals.length?Math.round(rtVals.reduce((a,b)=>a+b,0)/rtVals.length):null;
  return {
    n_untrained_correct:unt.filter(x=>x.correct).length,
    pct_untrained:unt.length?+(100*unt.filter(x=>x.correct).length/unt.length).toFixed(1):null,
    n_practiced_correct:prc.filter(x=>x.correct).length,
    pct_practiced:prc.length?+(100*prc.filter(x=>x.correct).length/prc.length).toFixed(1):null,
    test_completion_ms:test.durationMs||null,
    test_time_to_first_ms:ev.length?ev[0].t:null,
    test_mean_item_rt_ms:meanItemRtMs,
    test_total_plays:plays.length,
    test_unplayed_recordings:per.filter(x=>!played.has(x.word)).length,
    n_items_blank:per.filter(x=>!x.selectedRecordings||x.selectedRecordings.length===0).length,
    test_tab_hidden_count:testTab?testTab.count:0,
    test_tab_hidden_ms:testTab?Math.round(testTab.ms):0,
    test_items_json:JSON.stringify(items)
  };
}

function _practiceStats(practiceEntry){
  if(!practiceEntry) return {test_practice_accuracy:null,test_practice_duration_ms:null};
  const per=practiceEntry.perItem||[];
  return {
    test_practice_accuracy:per.length?+(100*per.filter(x=>x.correct).length/per.length).toFixed(1):null,
    test_practice_duration_ms:practiceEntry.durationMs||null
  };
}

/* =====================  HELPERS  ===================== */
const app = document.getElementById('app');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const now = () => performance.now();
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function page(html){ app.innerHTML = '<div class="card">'+html+'</div>'; window.scrollTo(0,0); }
function btn(label='Continue', enabled=true){
  return new Promise(res=>{
    const b=document.createElement('button'); b.className='primary'; b.textContent=label; b.disabled=!enabled;
    b.onclick=()=>res(); app.querySelector('.card').appendChild(b);
  });
}
function blocks(items,nb){          // randomized within block, no immediate repeat across boundaries
  const out=[]; let last=null;
  for(let b=0;b<nb;b++){ let s; do{ s=shuffle(items); }while(last!==null && s[0]===last && items.length>1); out.push(s); last=s[s.length-1]; }
  return out;
}

/* =====================  AUDIO  ===================== */
let fallbackUsed = false;
function speak(txt){
  return new Promise(res=>{
    if(!('speechSynthesis' in window)){ res(); return; }
    const u=new SpeechSynthesisUtterance(txt); u.rate=.7; u.lang='en-US';
    let d=false; const f=()=>{ if(!d){d=true;res();} };
    u.onend=f; u.onerror=f; setTimeout(f,4000);
    speechSynthesis.speak(u);
  });
}
function playClip(path,fb){
  return new Promise(res=>{
    const a=new Audio(CONFIG.audioBase+path); let d=false;
    const fall=()=>{ if(d)return; d=true; fallbackUsed=true; speak(fb).then(res); };
    a.onerror=fall; a.onended=()=>{ if(!d){d=true;res();} };
    a.play().catch(fall);
  });
}
const playPhoneme = p => playClip('phonemes/'+p+'.m4a', PH_TXT[p]);
const playWordOnly = w => playClip('words/'+w+'.m4a', respell(w));
async function playWord(w){              // phonemes one by one, then the whole word
  for(const c of w){ await playPhoneme(c); await sleep(250); }
  await sleep(350);
  await playWordOnly(w);
}

/* microphone + recording */
let stream=null;
function startRec(label){
  if(!stream || !window.MediaRecorder) return null;
  const chunks=[]; const r=new MediaRecorder(stream);
  r.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  r.start(); return {r,chunks,label};
}
function stopRec(h){
  return new Promise(res=>{
    if(!h){res();return;}
    h.r.onstop=()=>{ S.audio.push({label:h.label, blob:new Blob(h.chunks,{type:h.r.mimeType||'audio/webm'})}); res(); };
    h.r.stop();
  });
}

/* =====================  TRIAL ENGINE  ===================== */
// Handwriting condition only: participant sees the target symbol/word, hears its sound,
// copies it once on paper, then clicks Next to advance.
function runTrial({kind,target,audio,min,max,label,progress}){
  return new Promise(resolve=>{
    const ev=[], t0=now();
    let minDone=false, respDone=false, finished=false;
    const tgt='<div class="target">'+target.map(s=>'<span class="sym">'+s+'</span>').join('')+'</div>';
    const prompt = kind==='ls'
      ? 'Repeat the sound aloud <b>once</b>.'
      : 'Repeat the full pronunciation aloud <b>once</b>, blending the sounds.';
    const body =
      '<p class="inst">'+prompt+' Then copy the '+(kind==='ls'?'symbol':'whole word')+
      ' <b>once</b> on your paper and click Next.</p>'+
      '<div style="text-align:center"><button id="next" class="primary">Next</button></div>';
    page('<div class="progress">'+(progress||'')+'</div>'+tgt+body);

    const finish=st=>{
      if(finished) return; finished=true; clearTimeout(tMin); clearTimeout(tMax);
      resolve({kind,label,cond:'hand',target:target.join(''),status:st,durationMs:Math.round(now()-t0),events:ev});
    };
    const tMin=setTimeout(()=>{ minDone=true; if(respDone) finish('complete'); }, T(min));
    const tMax=setTimeout(()=>finish(respDone?'complete':'timeout'), T(max));
    const done=()=>{ respDone=true; if(minDone) finish('complete'); };
    Promise.resolve(audio()).catch(()=>{});

    const nb=document.getElementById('next');
    nb.onclick=()=>{ ev.push({t:Math.round(now()-t0),action:'next'}); nb.disabled=true; done(); };
  });
}

/* =====================  MATCHING TASK  ===================== */
// words: [{id, disp, plain, play}] — recording id equals word id
function matchTask({words,title,intro,submitLabel}){
  return new Promise(resolve=>{
    const ws=shuffle(words), rs=shuffle(words);
    const wl={}, rl={}; ws.forEach((w,i)=>wl[w.id]=String.fromCharCode(65+i)); rs.forEach((w,i)=>rl[w.id]=i+1);
    const pairs=new Set(), ev=[], plays={}; let sel=null; const t0=now();
    page('<h2>'+title+'</h2><p>'+intro+'</p><div class="cols"><div><b>Written words</b><div id="wl"></div></div><div><b>Recordings</b><div id="rl"></div></div></div>');
    const wlEl=document.getElementById('wl'), rlEl=document.getElementById('rl');
    wlEl.innerHTML=ws.map(w=>'<div class="wcard" data-w="'+w.id+'"><b>'+wl[w.id]+'</b><span class="wtxt'+(w.plain?' plain':'')+'">'+w.disp+'</span><span class="cnt"></span></div>').join('');
    rlEl.innerHTML=rs.map(w=>'<div class="rrow" data-r="'+w.id+'"><button class="play">▶</button><span class="lbl">Recording '+rl[w.id]+'</span><button class="tog" disabled>Match</button><span class="badges"></span></div>').join('');
    const byId={}; words.forEach(w=>byId[w.id]=w);
    const update=()=>{
      wlEl.querySelectorAll('.wcard').forEach(c=>{
        const id=c.dataset.w; c.classList.toggle('sel',id===sel);
        const k=[...pairs].filter(p=>p.startsWith(id+'|')).length; c.querySelector('.cnt').textContent=k?('✓ '+k):'';
      });
      rlEl.querySelectorAll('.rrow').forEach(r=>{
        const id=r.dataset.r, tog=r.querySelector('.tog'), on=sel&&pairs.has(sel+'|'+id);
        tog.disabled=!sel; tog.classList.toggle('on',!!on); tog.textContent=on?'✓ Matched':'Match';
        r.querySelector('.badges').innerHTML=[...pairs].filter(p=>p.endsWith('|'+id)).map(p=>'<span>'+wl[p.split('|')[0]]+'</span>').join('');
      });
    };
    wlEl.onclick=e=>{ const c=e.target.closest('.wcard'); if(!c) return; sel=c.dataset.w; ev.push({t:Math.round(now()-t0),action:'select-word',word:sel}); update(); };
    rlEl.onclick=e=>{
      const r=e.target.closest('.rrow'); if(!r) return; const id=r.dataset.r;
      if(e.target.closest('.play')){ plays[id]=(plays[id]||0)+1; ev.push({t:Math.round(now()-t0),action:'play',rec:id}); byId[id].play(); }
      else if(e.target.closest('.tog') && sel){
        const key=sel+'|'+id, on=!pairs.has(key); on?pairs.add(key):pairs.delete(key);
        ev.push({t:Math.round(now()-t0),action:on?'match':'unmatch',word:sel,rec:id}); update();
      }
    };
    update();
    const sb=document.createElement('button'); sb.className='primary'; sb.textContent=submitLabel||'Submit';
    sb.onclick=()=>{
      const un=words.filter(w=>![...pairs].some(p=>p.startsWith(w.id+'|'))).length;
      if(un && !confirm(un+' written word(s) have no matching recording yet. Submit anyway?')) return;
      resolve({pairs:[...pairs].map(p=>p.split('|')), events:ev, plays, durationMs:Math.round(now()-t0)});
    };
    app.querySelector('.card').appendChild(sb);
  });
}

/* =====================  SESSION SCREENS  ===================== */
async function setup(){
  page('<h2>Alphabet Learning Study</h2>'+
    '<p>Thank you for taking part. This session takes about <b>10 minutes</b> plus a few minutes of setup.</p>'+
    '<p><b>Before you begin, please:</b></p><ul>'+
    '<li>Get a <b>pen</b> and <b>one blank sheet of paper</b>.</li>'+
    '<li>Use a <b>computer</b> with <b>headphones</b> and a <b>working microphone</b>.</li>'+
    '<li>Be in a <b>quiet place</b>, close unrelated applications, and silence notifications.</li>'+
    '<li>Complete the session <b>on your own</b>, without notes or outside help.</li></ul>'+
    '<p class="mute">Participant code: '+S.pid+'</p>');
  await btn('I am ready');
}
async function consent(){
  page('<h2>Informed consent</h2>'+
    '<p class="mute"><i>[Replace this paragraph with your IRB-approved consent text, contact information, and risks/benefits statement.]</i></p>'+
    '<p>You will learn a small set of new symbols and sounds, then complete a short matching test. Participation is voluntary and you may stop at any time. '+
    'Your responses are stored under a participant code and kept separately from any contact information.</p>'+
    '<label><input type="checkbox" class="c"> I agree to take part in this study.</label>'+
    '<label><input type="checkbox" class="c"> I agree to have my <b>voice recorded</b> during the training portion.</label>'+
    '<label><input type="checkbox" class="c"> I agree to take and upload a <b>photograph of my paper</b> at the end.</label>');
  const b=document.createElement('button'); b.className='primary'; b.textContent='Continue'; b.disabled=true;
  const cs=[...app.querySelectorAll('.c')];
  cs.forEach(c=>c.onchange=()=>b.disabled=!cs.every(x=>x.checked));
  app.querySelector('.card').appendChild(b);
  await new Promise(r=>b.onclick=r);
}
async function micCheck(){
  page('<h2>Audio and microphone check</h2>'+
    '<p><b>1.</b> Click the button. You should hear a short tone.</p><button id="tone">Play sound</button>'+
    '<label><input type="checkbox" id="heard"> I heard the sound clearly</label>'+
    '<p><b>2.</b> Click "Enable microphone", allow access, and say a few words. The bar should move.</p>'+
    '<button id="mic">Enable microphone</button><div class="meter"><div id="lvl"></div></div>'+
    '<button id="rec" disabled>Record 3 seconds and play back</button>'+
    '<label><input type="checkbox" id="heardme"> I heard my own voice in the playback</label><p id="msg" class="warn"></p>');
  const b=document.createElement('button'); b.className='primary'; b.textContent='Continue'; b.disabled=!DEBUG;
  app.querySelector('.card').appendChild(b);
  const upd=()=>{ b.disabled = !DEBUG && !(document.getElementById('heard').checked && document.getElementById('heardme').checked && stream); };
  document.getElementById('heard').onchange=upd; document.getElementById('heardme').onchange=upd;
  document.getElementById('tone').onclick=()=>{
    const ctx=new (window.AudioContext||window.webkitAudioContext)(), o=ctx.createOscillator(), gn=ctx.createGain();
    o.frequency.value=440; gn.gain.value=.15; o.connect(gn); gn.connect(ctx.destination); o.start(); setTimeout(()=>{o.stop();ctx.close();},700);
  };
  document.getElementById('mic').onclick=async()=>{
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const ctx=new (window.AudioContext||window.webkitAudioContext)(), an=ctx.createAnalyser();
      ctx.createMediaStreamSource(stream).connect(an); const buf=new Uint8Array(an.fftSize);
      const lv=document.getElementById('lvl');
      (function loop(){ if(!document.body.contains(lv)){ctx.close();return;} an.getByteTimeDomainData(buf);
        let m=0; for(const v of buf) m=Math.max(m,Math.abs(v-128)); lv.style.width=Math.min(100,m*1.6)+'%'; requestAnimationFrame(loop); })();
      document.getElementById('rec').disabled=false; document.getElementById('msg').textContent=''; upd();
    }catch(e){ document.getElementById('msg').textContent='Microphone access was blocked. Please allow it in your browser and try again.'; }
  };
  document.getElementById('rec').onclick=async()=>{
    const r=document.getElementById('rec'); r.disabled=true; r.textContent='Recording…';
    const h=startRec('mic-check'); await sleep(3000);
    await new Promise(res=>{ h.r.onstop=res; h.r.stop(); });
    const url=URL.createObjectURL(new Blob(h.chunks,{type:h.r.mimeType||'audio/webm'}));
    r.textContent='Playing back…'; const a=new Audio(url); a.onended=()=>{ r.disabled=false; r.textContent='Record again'; }; a.play();
  };
  await new Promise(r=>b.onclick=r);
}
async function overview(){
  page('<h2>The task</h2><p>In this study you will <b>learn a new alphabet</b>. You will see new symbols, hear the sounds they stand for, and practice them. '+
    'Afterwards you will do a short matching task that uses what you learned.</p>'+
    '<p>Please follow each instruction exactly. Do not write extra copies or repeat sounds more than the instructions say.</p>');
  await btn();
}
async function demoMethod(){
  page('<h2>How you will respond</h2>'+
    '<p>You will <b>copy each symbol or word by hand</b> on your paper, once, then click Next to continue.</p>'+
    '<p>Here is a short demonstration using practice shapes (not the symbols you will learn).</p>');
  await btn('Start demo');
  S.practice.push(await runTrial({kind:'ls',target:['▲'],audio:()=>speak('ah'),min:T(3000),max:T(30000),label:'demo-ls',progress:'Demo 1 of 2'}));
  S.practice.push(await runTrial({kind:'ww',target:['▲','●','◆','■'],audio:()=>speak('demo word'),min:T(3000),max:T(30000),label:'demo-ww',progress:'Demo 2 of 2'}));
  page('<h2>Demo complete</h2><p>Next you will learn the real symbols, starting with single sounds.</p>');
  await btn();
}
async function lsTraining(){
  page('<h2>Part 1: Symbols and sounds</h2><p>You will see one symbol at a time and hear the sound it stands for <b>once</b>. '+
    'There are 24 short trials. Each lasts at least 5 seconds, so please do not rush ahead; the screen will move on by itself.</p>');
  await btn('Start');
  const rec=startRec('letter-sound-training');
  const bl=blocks(P,4); let k=0;
  for(let b=0;b<4;b++) for(const p of bl[b]){
    k++; const r=await runTrial({kind:'ls',target:[g[p]],audio:()=>playPhoneme(p),min:5000,max:20000,label:'LS',progress:'Trial '+k+' of 24'});
    Object.assign(r,{phoneme:p,block:b+1,trialNum:k,mappingVersion:S.mapVer}); S.trials.push(r);
    page('<div class="fix">+</div>'); await sleep(T(350));
  }
  await stopRec(rec);
}
async function wwTraining(){
  page('<h2>Part 2: Whole words</h2><p>Now the symbols are combined into four-symbol "words". For each word you will hear the sounds one by one, then the whole word. '+
    'Repeat the whole word aloud <b>once</b>, blending the sounds, then copy the word once on your paper and click Next.</p>'+
    '<p>There are 6 trials. Each lasts at least 8 seconds.</p>');
  await btn('Start');
  const rec=startRec('whole-word-training');
  const bl=[shuffle(WW_TRAIN)]; let k=0;
  for(let b=0;b<1;b++) for(const w of bl[b]){
    k++; const r=await runTrial({kind:'ww',target:toGlyphs(w),audio:()=>playWord(w),min:8000,max:25000,label:'WW',progress:'Trial '+k+' of 6'});
    Object.assign(r,{word:w,block:b+1,trialNum:k,mappingVersion:S.mapVer}); S.trials.push(r);
    page('<div class="fix">+</div>'); await sleep(T(350));
  }
  await stopRec(rec);
}
async function coverPaper(){
  page('<h2>Training finished</h2><p>Please <b>cover your paper</b> (face down or under something) so that no symbols or notes are visible during the test.</p>'+
    '<label><input type="checkbox" id="cv"> My paper is covered and no notes or symbol–sound keys are visible.</label>');
  const b=document.createElement('button'); b.className='primary'; b.textContent='Continue'; b.disabled=true;
  document.getElementById('cv').onchange=e=>b.disabled=!e.target.checked;
  app.querySelector('.card').appendChild(b); await new Promise(r=>b.onclick=r);
}
async function testPhase(){
  page('<h2>Matching test</h2><ul>'+
    '<li>Each written word is made of symbols you learned. Each recording is one spoken word.</li>'+
    '<li>Click a written word to select it, then use ▶ to listen to recordings and press <b>Match</b> next to the recording(s) that match it.</li>'+
    '<li>A written word may match <b>one or more</b> recordings. Select every recording that matches.</li>'+
    '<li>Recordings stay available after matching, and you can play them as often as you like.</li>'+
    '<li>The test has <b>two parts of 10 words each</b>. Click Submit after each part — Part 2 begins immediately.</li>'+
    '<li><b>Work as fast and as accurately as possible</b> — your time across both parts is recorded.</li>'+
    '<li>You will not receive feedback on accuracy.</li></ul>'+
    '<p>First, a short practice round with ordinary English words.</p>');
  await btn('Start practice');
  const pw=['red','blue','green'].map(x=>({id:x,disp:x,plain:true,play:()=>speak(x)}));
  S.practice.push({label:'practice-match',...await matchTask({title:'Practice',intro:'Match each written word to its recording.',words:pw,submitLabel:'Submit practice'})});
  page('<h2>Practice complete</h2><p>The real test has <b>20 words in two parts of 10</b>. Work through each part as fast and accurately as possible, then click Submit to move to the next part.</p>');
  await btn('Start test');
  const items=[...TEST_UNTRAINED.map(w=>({w,type:'untrained'})),...TEST_PRACTICED.map(w=>({w,type:'practiced'}))];

  // Split into two balanced blocks of 10 (2 practiced + 8 untrained each)
  const pracShuffle=shuffle(items.filter(x=>x.type==='practiced'));
  const untShuffle=shuffle(items.filter(x=>x.type==='untrained'));
  const block1Items=shuffle([...pracShuffle.slice(0,2),...untShuffle.slice(0,8)]);
  const block2Items=shuffle([...pracShuffle.slice(2,4),...untShuffle.slice(8,16)]);
  const toWord=it=>({id:it.w,disp:toGlyphs(it.w).join(''),play:()=>playWordOnly(it.w)});

  const res1=await matchTask({title:'Matching test — Part 1 of 2',intro:'Match each written word to its recording. Click Submit when done with this set.',words:block1Items.map(toWord),submitLabel:'Submit Part 1'});
  const res2=await matchTask({title:'Matching test — Part 2 of 2',intro:'Match each written word to its recording. Click Submit when done with this set.',words:block2Items.map(toWord),submitLabel:'Submit Part 2'});

  // Merge results — offset block 2 timestamps by block 1 duration (gap excluded)
  const res={
    pairs:[...res1.pairs,...res2.pairs],
    events:[...res1.events,...res2.events.map(e=>({...e,t:e.t+res1.durationMs}))],
    plays:Object.fromEntries([...new Set([...Object.keys(res1.plays),...Object.keys(res2.plays)])].map(k=>[k,(res1.plays[k]||0)+(res2.plays[k]||0)])),
    durationMs:res1.durationMs+res2.durationMs
  };

  const per=items.map(it=>{
    const sel=res.pairs.filter(p=>p[0]===it.w).map(p=>p[1]);
    return {word:it.w,type:it.type,selectedRecordings:sel,correct:(sel.length===1&&sel[0]===it.w)};
  });
  const acc=t=>{ const a=per.filter(x=>x.type===t); return +(100*a.filter(x=>x.correct).length/a.length).toFixed(1); };
  S.test={...res,perItem:per,pctCorrectUntrained:acc('untrained'),pctCorrectPracticed:acc('practiced')};
}
async function adherence(){
  page('<h2>Almost done</h2>'+
    '<p><b>1. Photograph of your paper.</b> Take a photo of your paper and upload it. Your paper should show your practice copies from training.</p>'+
    '<input type="file" id="ph" accept="image/*" capture="environment">'+
    '<p><b>2. A few quick questions</b> (please answer honestly; there are no penalties).</p>'+
    '<label>Were you interrupted during the session? <select id="q1"><option value="">choose…</option><option>No</option><option>Yes</option></select></label>'+
    '<label>Did you have any technical problems? <select id="q2"><option value="">choose…</option><option>No</option><option>Yes</option></select></label>'+
    '<label>Did you use notes or get help from anyone/anything? <select id="q3"><option value="">choose…</option><option>No</option><option>Yes</option></select></label>'+
    '<label>Did you do anything differently from the instructions? <select id="q4"><option value="">choose…</option><option>No</option><option>Yes</option></select></label>'+
    '<label>If you answered "Yes" to any question, please explain:<br><textarea id="q5" rows="3" style="width:100%"></textarea></label><p id="err" class="warn"></p>');
  const b=document.createElement('button'); b.className='primary'; b.textContent='Submit'; app.querySelector('.card').appendChild(b);
  await new Promise(res=>b.onclick=()=>{
    const v=i=>document.getElementById(i).value, f=document.getElementById('ph').files[0];
    if(!DEBUG && (!f||!v('q1')||!v('q2')||!v('q3')||!v('q4'))){ document.getElementById('err').textContent='Please upload a photo and answer all four questions.'; return; }
    S.photo=f||null; S.adherence={interrupted:v('q1'),technicalProblems:v('q2'),outsideHelp:v('q3'),deviations:v('q4'),explanation:v('q5')}; res();
  });
}
async function debrief(){
  page('<h2>Debriefing</h2>'+
    '<p>Thank you! This study compares two ways of learning a new alphabet: <b>writing symbols by hand</b> versus <b>selecting symbols on a screen</b>. '+
    'Half of the participants learned by handwriting and half by symbol selection, and everyone took the same matching test. '+
    'We could not describe this comparison earlier because knowing it might have changed how you approached the task.</p>'+
    '<p>The test mostly used new combinations of symbols you had not seen, to check whether you learned the individual symbol–sound links. '+
    'Your photograph and recordings are used only to check that the instructions were followed, and are labeled with your participant code.</p>'+
    '<p class="mute">[Add researcher contact information here.]</p>');
  await btn('Finish');
}
function buildData(){
  return {
    participantId:S.pid, design:'between-subjects', condition:S.cond, mappingVersion:S.mapVer, glyphMap:g,
    startedAt:S.startedAt, finishedAt:new Date().toISOString(), debugMode:DEBUG, userAgent:navigator.userAgent,
    spokenFallbackUsed:fallbackUsed, trials:S.trials, practice:S.practice, test:S.test, adherence:S.adherence,
    selectionErrors:0, selectionTimeouts:0
  };
}
async function finish(){
  const data=buildData(), json=JSON.stringify(data,null,2);
  try{ localStorage.setItem('alphabet_study_'+S.pid,json); }catch(e){}
  _logPhase('finish');

  await _atPatch('ExpSessions', _DL.sessionRecId, {
    status:'completed',
    completed_at:new Date().toISOString(),
    total_duration_s:Math.round((Date.now()-Date.parse(S.startedAt))/1000),
    last_phase_completed:_DL.lastPhase,
    phase_timestamps_json:JSON.stringify(_DL.phases),
    tab_hidden_count:_DL.tab.count,
    tab_hidden_ms:Math.round(_DL.tab.ms),
    interruptions:S.adherence?.interrupted==='Yes',
    technical_problems:S.adherence?.technicalProblems==='Yes',
    outside_help:S.adherence?.outsideHelp==='Yes',
    deviations:S.adherence?.deviations==='Yes',
    adherence_notes:S.adherence?.explanation||'',
    photo_uploaded:!!S.photo,
    voice_recordings_n:S.audio?.length||0,
    raw_json:json.slice(0,99000)
  });
  localStorage.setItem('alphabet_study_done','1');

  page('<h2>All done — thank you!</h2><p>Your data was sent to the researcher.</p>'+
    '<p class="mute">Researcher export: download the file below.</p><div id="dl"></div>');
  const dl=document.getElementById('dl');
  const add=(blob,name)=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.textContent='Download '+name; a.style.display='block'; a.style.margin='6px 0'; dl.appendChild(a); };
  add(new Blob([json],{type:'application/json'}),S.pid+'_data.json');
  S.audio.forEach(a=>add(a.blob,S.pid+'_'+a.label+'.webm'));
  if(S.photo) add(S.photo,S.pid+'_paper_'+S.photo.name);
  window.__studyData=data;
}

/* =====================  RUN  ===================== */
(async function main(){
  try{
    _DL.appVersion = sessionStorage.getItem('app_version') ||
      await fetch('https://api.github.com/repos/TedSPumpkins1475/alphabet-study/commits/main',
        {headers:{'Accept':'application/vnd.github.sha'}})
        .then(r=>r.text()).then(s=>{ const v=s.trim().slice(0,7); sessionStorage.setItem('app_version',v); return v; })
        .catch(()=>'unknown');

    await setup(); _logPhase('setup');

    _DL.sessionRecId = await _atCreate('ExpSessions', {
      session_id:_DL.sessionId,
      participant_code:S.pid,
      external_id:Q.get('pid')||'',
      design:'between-subjects',
      condition:'handwriting',
      is_test:DEBUG||Q.has('test'),
      app_version:_DL.appVersion,
      mapping_version:String(S.mapVer),
      started_at:S.startedAt,
      status:'in_progress',
      user_agent:navigator.userAgent,
      screen_wh:screen.width+'x'+screen.height,
      window_wh:window.innerWidth+'x'+window.innerHeight,
      is_mobile:/Mobi|Android/i.test(navigator.userAgent)||navigator.maxTouchPoints>1,
      timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,
      prior_completion_detected:!!localStorage.getItem('alphabet_study_done')
    });

    await consent(); _logPhase('consent');
    await _atPatch('ExpSessions', _DL.sessionRecId, {
      consent_participate:true, consent_voice:true, consent_photo:true,
      consent_at:new Date().toISOString()
    });

    await micCheck(); _logPhase('mic_check');
    await _atPatch('ExpSessions', _DL.sessionRecId, {
      audio_check_passed:true, mic_check_passed:true, last_phase_completed:'mic_check'
    });

    await overview(); _logPhase('overview');
    await demoMethod(); _logPhase('demo');

    _DL.blockRecId = await _atCreate('ExpBlocks', {
      session_id:_DL.sessionId,
      participant_code:S.pid,
      design:'between-subjects',
      condition:'handwriting',
      alphabet:'single',
      order_position:1,
      mapping_version:S.mapVer,
      symbol_map_json:JSON.stringify(g),
      grid_layout_json:JSON.stringify([])
    });
    _logPhase('training_start');

    await lsTraining();
    await wwTraining();
    await coverPaper(); _logPhase('cover_paper');

    _DL._inTest=true; _DL.testTab={count:0,ms:0,_t:null};
    await testPhase(); _logPhase('test_complete');
    _DL._inTest=false;

    const practiceEntry=S.practice.filter(p=>p.label==='practice-match').slice(-1)[0];
    await _atPatch('ExpBlocks', _DL.blockRecId, {
      ..._lsStats(S.trials),
      ..._wwStats(S.trials),
      ..._practiceStats(practiceEntry),
      ..._testStats(S.test, _DL.testTab),
      letter_trials_json:JSON.stringify(S.trials.filter(t=>t.kind==='ls')),
      word_trials_json:JSON.stringify(S.trials.filter(t=>t.kind==='ww')),
      test_practice_json:JSON.stringify(practiceEntry||{}),
      demo_json:JSON.stringify(S.practice.filter(p=>p.label?.startsWith('demo')))
    });

    await adherence(); _logPhase('adherence');
    await debrief(); _logPhase('debrief');
    await finish();
  }catch(e){ page('<h2>Something went wrong</h2><p class="warn">'+e.message+'</p><p>Please contact the researcher.</p>'); console.error(e); }
})();
})();
