<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alphabet Learning Study (PSY300 Lab 7, within-subjects)</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#1d2330;--mute:#5b6475;--accent:#2f5fd0;--ok:#2e9e5b;--bad:#d64545;--line:#d9dde5}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #app{max-width:820px;margin:0 auto;padding:24px 16px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 30px}
  h2{margin-top:0}
  button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 16px;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);margin-top:18px}
  label{display:block;margin:8px 0}
  .mute{color:var(--mute);font-size:.92em}
  .warn{color:var(--bad)}
  .progress{color:var(--mute);font-size:.85em;text-align:right}
  .target{display:flex;justify-content:center;gap:14px;margin:18px 0;direction:ltr}
  /* Alphabet A uses Hebrew-specific fonts; Alphabet B uses math/symbol fonts.
     The combined stack handles both — Hebrew fonts fall back to system fonts for
     non-Hebrew Unicode (arrows, math) so both alphabets render correctly. */
  .sym{font-family:"Noto Sans Hebrew","Arial Hebrew","Noto Sans","Segoe UI Symbol",system-ui,sans-serif;font-size:96px;line-height:1.1;direction:ltr;unicode-bidi:isolate}
  .grid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:14px 0;direction:ltr}
  .grid button{width:92px;height:92px;padding:0;font-family:"Noto Sans Hebrew","Arial Hebrew","Noto Sans","Segoe UI Symbol",system-ui,sans-serif;font-size:50px}
  .grid button.ok{background:#dff4e7;border-color:var(--ok)}
  .grid button.bad{background:#fbe0e0;border-color:var(--bad)}
  .slots{display:flex;justify-content:center;gap:10px;margin:14px 0;direction:ltr}
  .slot{width:78px;height:86px;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:46px;cursor:pointer;font-family:"Noto Sans Hebrew","Arial Hebrew","Noto Sans","Segoe UI Symbol",system-ui,sans-serif}
  .slot.full{border-style:solid;border-color:var(--accent)}
  .inst{text-align:center;color:var(--mute)}
  .fix{font-size:60px;text-align:center;padding:90px 0;color:var(--mute)}
  .meter{height:12px;background:#e8ebf1;border-radius:6px;overflow:hidden;margin:8px 0}
  .meter>div{height:100%;width:0;background:var(--ok)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:640px){.cols{grid-template-columns:1fr}.card{padding:20px 16px}}
  .wcard,.rrow{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:7px 0;display:flex;align-items:center;gap:10px}
  .wcard{cursor:pointer;user-select:none}
  .wcard.sel{border-color:var(--accent);background:#e8effd;box-shadow:0 0 0 2px var(--accent) inset}
  .wcard b{width:22px;color:var(--mute)}
  .wtxt{font-size:30px;direction:ltr;unicode-bidi:bidi-override;font-family:"Noto Sans Hebrew","Arial Hebrew","Noto Sans","Segoe UI Symbol",system-ui,sans-serif;flex:1}
  .wtxt.plain{unicode-bidi:normal;font-family:inherit;font-size:22px}
  .cnt{color:var(--mute);font-size:.8em}
  .rrow .lbl{flex:1}
  .badges span{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;padding:0 7px;margin-left:3px;font-size:.8em}
  .tog.on{background:#dff4e7;border-color:var(--ok)}
  .alpha-badge{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;padding:2px 10px;font-size:.85em;margin-left:8px;vertical-align:middle}
  .alpha-badge.b{background:#7b4fc9}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';

/* =====================  CONFIG  ===================== */
const Q = new URLSearchParams(location.search);
const DEBUG = Q.has('debug');
const T = ms => DEBUG ? Math.max(300, ms/10) : ms;
const CONFIG = {
  audioBase: 'audio/',
  submitUrl: 'https://script.google.com/macros/s/AKfycbzp96TC7DrhjKKNBpIwZK0bcPYYVb6q9LwHksUFnWlI5a-WY6OtYNxTey5KT3uEH1sjvQ/exec',
  proxyUrl: 'https://singular-phoenix-10443e.netlify.app/.netlify/functions/submit'
};

/* =====================  STIMULI  ===================== */
// Phoneme set — same for both alphabets
const P = ['a','m','n','t','i','p'];

// Alphabet A: Hebrew-derived symbols (Law et al., 2018)
// Phoneme order:  /ɑ/  /m/  /n/  /t/  /i/  /p/
const GL_A = ['ם','צ','ש','ר','ט','פ'];

// Alphabet B: Aurebesh-derived symbols (aurebesh.org), Unicode approximations.
// Same six phonemes, visually distinct symbol set.
// /ɑ/  /m/  /n/  /t/  /i/  /p/
const GL_B = ['↗', 'Ξ', 'Ψ', '⊥', '↙', '⊢'];

// TTS fallback strings — pronounce the phoneme sound, not the letter name.
//   a → "ah" (/ɑ/),  i → "ee" (/i/),  m → "muh",  n → "nuh"
//   p → "puh",  t → "cha" (/tʃ/ — matches the voice used in recordings)
const PH_TXT = {m:'muh', n:'nuh', p:'puh', t:'cha', a:'ah', i:'ee'};

// Respell a CVCV word into phonemic syllables so TTS says e.g. "pah nee" for 'pani'.
const RESPELL_C = {m:'m', n:'n', p:'p', t:'ch'};
const RESPELL_V = {a:'ah', i:'ee'};
const respell = w => {
  const parts = [];
  for(let i = 0; i < w.length; i += 2){
    const c = RESPELL_C[w[i]]   || w[i];
    const v = RESPELL_V[w[i+1]] || w[i+1] || '';
    parts.push(c + v);
  }
  return parts.join(' ');
};

// Alphabet A word lists — identical to the between-subjects design
const WW_TRAIN_A    = ['pani','mapi','tama','nini','nata','tipi'];
const TEST_PRAC_A   = ['pani','mapi','tama','nini'];
const TEST_UNT_A    = ['pini','pata','mipi','mima','mati','nama','titi','pana','mipa','napa','nima','tati','tima','pina','napi','tita'];

// Alphabet B word lists — different phoneme sequences to reduce cross-alphabet interference.
// Training words do not overlap with Alphabet A training words.
const WW_TRAIN_B    = ['nipi','nimi','tapi','titi','pima','mapa'];
const TEST_PRAC_B   = ['nipi','nimi','tapi','titi'];
const TEST_UNT_B    = ['mapi','nini','tama','pana','nami','pina','mita','nata','tipa','tima','mati','pini','mata','pani','timi','papi'];

// Practice symbols for response-method demos (not part of either alphabet)
const DEMO_SYMS = ['◆','▲','●','■','★','✚'];

/* =====================  COUNTERBALANCING  ===================== */
// 4 versions vary which alphabet is hand-written and which is taught first.
//   Version 0: Hand=A first,  Select=B second
//   Version 1: Select=A first, Hand=B second
//   Version 2: Hand=B first,  Select=A second
//   Version 3: Select=B first, Hand=A second
// This fully crosses alphabet order × training method, equating exposure.
const vParam = Q.get('v');
const version = (vParam !== null && vParam >= 0 && vParam <= 3)
  ? +vParam
  : Math.floor(Math.random() * 4);

const alphaOrder = (version < 2) ? ['A','B'] : ['B','A'];
const condA = (version === 0 || version === 2) ? 'hand' : 'select';
const condB = (condA === 'hand') ? 'select' : 'hand';

/* =====================  STATE  ===================== */
// Independent mapping versions for each alphabet — rotates which glyph maps to which phoneme.
const mapVerA = Q.has('mapA') ? (+Q.get('mapA') % 6) : Math.floor(Math.random() * 6);
const mapVerB = Q.has('mapB') ? (+Q.get('mapB') % 6) : Math.floor(Math.random() * 6);

const g_A = {}, g_B = {};
P.forEach((p, j) => { g_A[p] = GL_A[(j + mapVerA) % 6]; g_B[p] = GL_B[(j + mapVerB) % 6]; });

// Grid positions are fixed per alphabet throughout that alphabet's training.
const gridA = shuffle(GL_A);
const gridB = shuffle(GL_B);

const toGlyphsA = w => [...w].map(c => g_A[c]);
const toGlyphsB = w => [...w].map(c => g_B[c]);

function getAlphaConfig(alpha){
  if(alpha === 'A') return {
    g: g_A, GL: GL_A, grid: gridA, cond: condA,
    toGlyphs: toGlyphsA, ww: WW_TRAIN_A, tp: TEST_PRAC_A, tu: TEST_UNT_A,
    label: 'Alphabet A', mapVer: mapVerA, badge: 'A'
  };
  return {
    g: g_B, GL: GL_B, grid: gridB, cond: condB,
    toGlyphs: toGlyphsB, ww: WW_TRAIN_B, tp: TEST_PRAC_B, tu: TEST_UNT_B,
    label: 'Alphabet B', mapVer: mapVerB, badge: 'B'
  };
}

const S = {
  pid: Q.get('pid') || ('P' + Math.random().toString(36).slice(2,8).toUpperCase()),
  version, condA, condB, alphaOrder,
  mapVerA, mapVerB, glyphMapA: g_A, glyphMapB: g_B,
  startedAt: new Date().toISOString(),
  trials: {A:[], B:[]}, practice: [], test: {A:null, B:null},
  adherence: null, audio: [], photo: null
};

/* =====================  DATA LAYER  ===================== */
const _DL = {
  sessionId: (()=>{ try{ return crypto.randomUUID(); }catch(e){ return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16);}); } })(),
  appVersion: 'unknown',
  sessionRecId: null,
  blockRecIds: {},
  phases: {},
  lastPhase: 'init',
  tab: { count: 0, ms: 0, _t: null },
  testTab: { count: 0, ms: 0, _t: null },
  _inTest: false
};

document.addEventListener('visibilitychange', ()=>{
  const hidden = document.hidden;
  const now = performance.now();
  [_DL.tab, ...((_DL._inTest)?[_DL.testTab]:[])].forEach(t=>{
    if(hidden){ t._t=now; t.count++; }
    else if(t._t!=null){ t.ms+=now-t._t; t._t=null; }
  });
});

function _logPhase(name){ _DL.phases[name]=new Date().toISOString(); _DL.lastPhase=name; }

async function _atCall(payload){
  try{
    const r=await fetch(CONFIG.proxyUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    return await r.json();
  }catch(e){ console.warn('Airtable call failed:',e); return {}; }
}
async function _atCreate(table,fields){
  const r=await _atCall({op:'create',table,records:[{fields}]});
  return r.ids?.[0]||null;
}
async function _atPatch(table,id,fields){
  if(!id) return;
  await _atCall({op:'patch',table,updates:[{id,fields}]});
}

function _lsStats(trials){
  const ls=trials.filter(t=>t.kind==='ls');
  const sel=ls.filter(t=>t.cond==='select');
  const sorted=[...ls].sort((a,b)=>a.durationMs-b.durationMs);
  const med=sorted.length?sorted[Math.floor(sorted.length/2)].durationMs:null;
  const fok=t=>(t.events||[]).find(e=>typeof e.correct==='boolean')?.correct===true;
  const b1=sel.filter(t=>t.block===1), b2=sel.filter(t=>t.block===2);
  return {
    ls_n_trials:ls.length,
    ls_n_completed:ls.filter(t=>t.status==='complete').length,
    ls_n_timed_out:ls.filter(t=>t.status==='timeout').length,
    ls_total_exposure_ms:ls.reduce((s,t)=>s+t.durationMs,0),
    ls_mean_duration_ms:ls.length?Math.round(ls.reduce((s,t)=>s+t.durationMs,0)/ls.length):null,
    ls_median_duration_ms:med,
    ls_first_click_pct:sel.length?+(100*sel.filter(fok).length/sel.length).toFixed(1):null,
    ls_first_click_pct_b1:b1.length?+(100*b1.filter(fok).length/b1.length).toFixed(1):null,
    ls_first_click_pct_b2:b2.length?+(100*b2.filter(fok).length/b2.length).toFixed(1):null,
    ls_total_incorrect_clicks:sel.reduce((s,t)=>s+(t.events||[]).filter(e=>e.correct===false).length,0)
  };
}

function _wwStats(trials){
  const ww=trials.filter(t=>t.kind==='ww');
  return {
    ww_n_trials:ww.length,
    ww_n_completed:ww.filter(t=>t.status==='complete').length,
    ww_n_timed_out:ww.filter(t=>t.status==='timeout').length,
    ww_total_exposure_ms:ww.reduce((s,t)=>s+t.durationMs,0),
    ww_mean_duration_ms:ww.length?Math.round(ww.reduce((s,t)=>s+t.durationMs,0)/ww.length):null,
    ww_total_slot_corrections:ww.reduce((s,t)=>s+(t.events||[]).filter(e=>e.action==='remove').length,0)
  };
}

function _testStats(test, testTab){
  if(!test) return {};
  const per=test.perItem||[], ev=test.events||[];
  const unt=per.filter(x=>x.type==='untrained'), prc=per.filter(x=>x.type==='practiced');
  const plays=ev.filter(e=>e.action==='play');
  const played=new Set(plays.map(e=>e.rec));
  const items=per.map(item=>{
    const wev=ev.filter(e=>e.word===item.word);
    const selEvents=wev.filter(e=>e.action==='select-word');
    const matchEvents=wev.filter(e=>e.action==='match');
    const firstSelectedMs=selEvents.length?selEvents[0].t:null;
    const finalMatchMs=matchEvents.length?matchEvents[matchEvents.length-1].t:null;
    const itemRtMs=(firstSelectedMs!==null&&finalMatchMs!==null)?finalMatchMs-firstSelectedMs:null;
    return {
      item_id:item.word, item_type:item.type,
      exact_correct:item.correct,
      selected_recordings:item.selectedRecordings,
      correct_recording_ids:[item.word],
      hits:item.selectedRecordings.includes(item.word)?1:0,
      false_alarms:item.selectedRecordings.filter(r=>r!==item.word).length,
      misses:item.selectedRecordings.includes(item.word)?0:1,
      n_selections:item.selectedRecordings.length,
      n_plays:plays.filter(p=>p.rec===item.word).length,
      first_selected_ms:firstSelectedMs,
      final_match_ms:finalMatchMs,
      item_rt_ms:itemRtMs
    };
  });
  const rtVals=items.map(x=>x.item_rt_ms).filter(x=>x!==null);
  const meanItemRtMs=rtVals.length?Math.round(rtVals.reduce((a,b)=>a+b,0)/rtVals.length):null;
  return {
    n_untrained_correct:unt.filter(x=>x.correct).length,
    pct_untrained:unt.length?+(100*unt.filter(x=>x.correct).length/unt.length).toFixed(1):null,
    n_practiced_correct:prc.filter(x=>x.correct).length,
    pct_practiced:prc.length?+(100*prc.filter(x=>x.correct).length/prc.length).toFixed(1):null,
    test_completion_ms:test.durationMs||null,
    test_time_to_first_ms:ev.length?ev[0].t:null,
    test_mean_item_rt_ms:meanItemRtMs,
    test_total_plays:plays.length,
    test_unplayed_recordings:per.filter(x=>!played.has(x.word)).length,
    n_items_blank:per.filter(x=>!x.selectedRecordings||x.selectedRecordings.length===0).length,
    test_tab_hidden_count:testTab?testTab.count:0,
    test_tab_hidden_ms:testTab?Math.round(testTab.ms):0,
    test_items_json:JSON.stringify(items)
  };
}

function _practiceStats(practiceEntry){
  if(!practiceEntry) return {test_practice_accuracy:null,test_practice_duration_ms:null};
  const per=practiceEntry.perItem||[];
  const correct=per.filter(x=>x.correct).length;
  return {
    test_practice_accuracy:per.length?+(100*correct/per.length).toFixed(1):null,
    test_practice_duration_ms:practiceEntry.durationMs||null
  };
}

/* =====================  HELPERS  ===================== */
const app = document.getElementById('app');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const now = () => performance.now();
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function page(html){ app.innerHTML = '<div class="card">'+html+'</div>'; window.scrollTo(0,0); }
function btn(label='Continue', enabled=true){
  return new Promise(res=>{
    const b=document.createElement('button'); b.className='primary'; b.textContent=label; b.disabled=!enabled;
    b.onclick=()=>res(); app.querySelector('.card').appendChild(b);
  });
}
function blocks(items, nb){
  const out=[]; let last=null;
  for(let b=0;b<nb;b++){ let s; do{ s=shuffle(items); }while(last!==null && s[0]===last && items.length>1); out.push(s); last=s[s.length-1]; }
  return out;
}
function alphaBadge(letter){ return '<span class="alpha-badge'+(letter==='B'?' b':'')+'">'+'Alphabet '+letter+'</span>'; }

/* =====================  AUDIO  ===================== */
let fallbackUsed = false;
function speak(txt){
  return new Promise(res=>{
    if(!('speechSynthesis' in window)){ res(); return; }
    const u=new SpeechSynthesisUtterance(txt); u.rate=.7; u.lang='en-US';
    let d=false; const f=()=>{ if(!d){d=true;res();} };
    u.onend=f; u.onerror=f; setTimeout(f,4000);
    speechSynthesis.speak(u);
  });
}
function playClip(path, fb){
  return new Promise(res=>{
    const a=new Audio(CONFIG.audioBase+path); let d=false;
    const fall=()=>{ if(d)return; d=true; fallbackUsed=true; speak(fb).then(res); };
    a.onerror=fall; a.onended=()=>{ if(!d){d=true;res();} };
    a.play().catch(fall);
  });
}
const playPhoneme = p => playClip('phonemes/'+p+'.m4a', PH_TXT[p]);
const playWordOnly = w => playClip('words/'+w+'.m4a', respell(w));
async function playWord(w){
  for(const c of w){ await playPhoneme(c); await sleep(250); }
  await sleep(350);
  await playWordOnly(w);
}

/* microphone + recording */
let stream = null;
function startRec(label){
  if(!stream || !window.MediaRecorder) return null;
  const chunks=[]; const r=new MediaRecorder(stream);
  r.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  r.start(); return {r, chunks, label};
}
function stopRec(h){
  return new Promise(res=>{
    if(!h){res();return;}
    h.r.onstop=()=>{ S.audio.push({label:h.label, blob:new Blob(h.chunks,{type:h.r.mimeType||'audio/webm'})}); res(); };
    h.r.stop();
  });
}

/* =====================  TRIAL ENGINE  ===================== */
function runTrial({kind, target, grid, audio, min, max, cond, label, progress}){
  return new Promise(resolve=>{
    const n=target.length, slots=Array(n).fill(null), ev=[], t0=now();
    let minDone=false, respDone=false, finished=false;
    const tgt='<div class="target">'+target.map(s=>'<span class="sym">'+s+'</span>').join('')+'</div>';
    const prompt = kind==='ls'
      ? 'Repeat the sound aloud <b>once</b>.'
      : 'Repeat the full pronunciation aloud <b>once</b>, blending the sounds.';
    let body;
    if(cond==='hand'){
      body = '<p class="inst">'+prompt+' Then copy the '+(kind==='ls'?'symbol':'whole word')+' <b>once</b> on your paper and click Next.</p>'+
             '<div style="text-align:center"><button id="next" class="primary">Next</button></div>';
    } else if(kind==='ls'){
      body = '<p class="inst">'+prompt+' Then click the matching symbol below.</p>'+
             '<div class="grid" id="grid">'+grid.map(s=>'<button data-s="'+s+'">'+s+'</button>').join('')+'</div>'+
             '<p id="sel-fb" style="color:#c0392b;font-weight:bold;min-height:1.5em;text-align:center;margin-top:8px"></p>';
    } else {
      body = '<p class="inst">'+prompt+' Then rebuild the word by clicking the symbols in order. Click a filled box to remove that symbol.</p>'+
             '<div class="slots" id="slots"></div>'+
             '<div class="grid" id="grid">'+grid.map(s=>'<button data-s="'+s+'">'+s+'</button>').join('')+'</div>'+
             '<p id="sel-fb" style="color:#c0392b;font-weight:bold;min-height:1.5em;text-align:center;margin-top:8px"></p>';
    }
    page('<div class="progress">'+(progress||'')+'</div>'+tgt+body);

    const finish=st=>{
      if(finished)return; finished=true; clearTimeout(tMin); clearTimeout(tMax);
      resolve({kind, label, cond, target:target.join(''), status:st, durationMs:Math.round(now()-t0), events:ev});
    };
    const tMin=setTimeout(()=>{ minDone=true; if(respDone) finish('complete'); }, T(min));
    const tMax=setTimeout(()=>finish(respDone?'complete':'timeout'), T(max));
    const done=()=>{ respDone=true; if(minDone) finish('complete'); };
    Promise.resolve(audio()).catch(()=>{});

    if(cond==='hand'){
      const nb=document.getElementById('next');
      nb.onclick=()=>{ ev.push({t:Math.round(now()-t0),action:'next'}); nb.disabled=true; done(); };
    } else if(kind==='ls'){
      const gr=document.getElementById('grid');
      gr.onclick=e=>{
        const b=e.target.closest('button'); if(!b||respDone)return;
        const s=b.dataset.s, ok=(s===target[0]);
        ev.push({t:Math.round(now()-t0),sym:s,correct:ok});
        if(ok){ b.classList.add('ok'); gr.querySelectorAll('button').forEach(x=>x.disabled=true); document.getElementById('sel-fb').textContent=''; done(); }
        else { b.classList.add('bad'); setTimeout(()=>b.classList.remove('bad'),350); document.getElementById('sel-fb').textContent='✗ Incorrect — try again.'; }
      };
    } else {
      const sl=document.getElementById('slots'), gr=document.getElementById('grid');
      const render=()=>{ sl.innerHTML=slots.map((s,i)=>'<div class="slot'+(s?' full':'')+'" data-i="'+i+'">'+(s||'')+'</div>').join(''); };
      render();
      gr.onclick=e=>{
        const b=e.target.closest('button'); if(!b||respDone)return;
        const i=slots.indexOf(null); if(i<0)return;
        slots[i]=b.dataset.s; ev.push({t:Math.round(now()-t0),action:'add',sym:b.dataset.s,slot:i}); render();
        const fb=document.getElementById('sel-fb');
        if(slots.every((x,k)=>x===target[k])){ gr.querySelectorAll('button').forEach(x=>x.disabled=true); fb.textContent=''; done(); }
        else if(slots.indexOf(null)<0){ fb.textContent='✗ Not quite — remove a symbol and try again.'; ev.push({t:Math.round(now()-t0),action:'word-wrong'}); }
        else { fb.textContent=''; }
      };
      sl.onclick=e=>{
        const d=e.target.closest('.slot'); if(!d||respDone)return;
        const i=+d.dataset.i; if(slots[i]){ ev.push({t:Math.round(now()-t0),action:'remove',slot:i}); slots[i]=null; render(); }
      };
    }
  });
}

/* =====================  MATCHING TASK  ===================== */
function matchTask({words, title, intro, submitLabel}){
  return new Promise(resolve=>{
    const ws=shuffle(words), rs=shuffle(words);
    const wl={}, rl={};
    ws.forEach((w,i)=>wl[w.id]=String.fromCharCode(65+i));
    rs.forEach((w,i)=>rl[w.id]=i+1);
    const pairs=new Set(), ev=[], plays={}; let sel=null; const t0=now();
    page('<h2>'+title+'</h2><p>'+intro+'</p><div class="cols"><div><b>Written words</b><div id="wl"></div></div><div><b>Recordings</b><div id="rl"></div></div></div>');
    const wlEl=document.getElementById('wl'), rlEl=document.getElementById('rl');
    wlEl.innerHTML=ws.map(w=>'<div class="wcard" data-w="'+w.id+'"><b>'+wl[w.id]+'</b><span class="wtxt'+(w.plain?' plain':'')+'">'+w.disp+'</span><span class="cnt"></span></div>').join('');
    rlEl.innerHTML=rs.map(w=>'<div class="rrow" data-r="'+w.id+'"><button class="play">▶</button><span class="lbl">Recording '+rl[w.id]+'</span><button class="tog" disabled>Match</button><span class="badges"></span></div>').join('');
    const byId={}; words.forEach(w=>byId[w.id]=w);
    const update=()=>{
      wlEl.querySelectorAll('.wcard').forEach(c=>{
        const id=c.dataset.w; c.classList.toggle('sel',id===sel);
        const k=[...pairs].filter(p=>p.startsWith(id+'|')).length; c.querySelector('.cnt').textContent=k?('✓ '+k):'';
      });
      rlEl.querySelectorAll('.rrow').forEach(r=>{
        const id=r.dataset.r, tog=r.querySelector('.tog'), on=sel&&pairs.has(sel+'|'+id);
        tog.disabled=!sel; tog.classList.toggle('on',!!on); tog.textContent=on?'✓ Matched':'Match';
        r.querySelector('.badges').innerHTML=[...pairs].filter(p=>p.endsWith('|'+id)).map(p=>'<span>'+wl[p.split('|')[0]]+'</span>').join('');
      });
    };
    wlEl.onclick=e=>{ const c=e.target.closest('.wcard'); if(!c)return; sel=c.dataset.w; ev.push({t:Math.round(now()-t0),action:'select-word',word:sel}); update(); };
    rlEl.onclick=e=>{
      const r=e.target.closest('.rrow'); if(!r)return; const id=r.dataset.r;
      if(e.target.closest('.play')){ plays[id]=(plays[id]||0)+1; ev.push({t:Math.round(now()-t0),action:'play',rec:id}); byId[id].play(); }
      else if(e.target.closest('.tog')&&sel){
        const key=sel+'|'+id, on=!pairs.has(key); on?pairs.add(key):pairs.delete(key);
        ev.push({t:Math.round(now()-t0),action:on?'match':'unmatch',word:sel,rec:id}); update();
      }
    };
    update();
    const sb=document.createElement('button'); sb.className='primary'; sb.textContent=submitLabel||'Submit';
    sb.onclick=()=>{
      const un=words.filter(w=>![...pairs].some(p=>p.startsWith(w.id+'|'))).length;
      if(un&&!confirm(un+' written word(s) have no matching recording yet. Submit anyway?'))return;
      resolve({pairs:[...pairs].map(p=>p.split('|')), events:ev, plays, durationMs:Math.round(now()-t0)});
    };
    app.querySelector('.card').appendChild(sb);
  });
}

async function lsTraining(alpha, A){
  const methodDesc = A.cond==='hand'
    ? 'copy the symbol <b>once</b> on your paper and click Next'
    : 'click the matching symbol in the grid below';
  page('<h2>'+alphaBadge(alpha)+' Symbols and sounds</h2>'+
    '<p>You will see one symbol at a time and hear the sound it stands for <b>once</b>. '+
    'There are 12 short trials. Each lasts at least 5 seconds — do not rush ahead.</p>'+
    '<p>After hearing each sound, repeat it aloud <b>once</b>, then <b>'+methodDesc+'</b>.</p>');
  await btn('Start');
  const rec=startRec(alpha+'-letter-sound');
  const bl=blocks(P,2); let k=0;
  for(let b=0;b<2;b++) for(const p of bl[b]){
    k++;
    const r=await runTrial({kind:'ls', target:[A.g[p]], grid:A.grid, audio:()=>playPhoneme(p), min:5000, max:20000, cond:A.cond, label:'LS-'+alpha, progress:A.label+' — Trial '+k+' of 12'});

  await stopRec(rec);
}

async function testPhase(alpha, A, isFirst){
  const pracWords = isFirst
    ? ['red','blue','green']
    : ['sun','frog','milk'];

  page('<h2>'+alphaBadge(alpha)+' Matching test</h2><ul>'+
    '<li>Each written word uses '+A.label+' symbols you just learned.</li>'+
    '<li>Click a written word to select it, then use ▶ to listen to recordings and press <b>Match</b> next to the matching recording(s).</li>'+
    '<li>A written word may match <b>one or more</b> recordings — select <b>all</b> that match.</li>'+
    '<li>Recordings stay available after matching.</li>'+
    '<li>The test has <b>two parts of 10 words each</b>. Click Submit after each part — Part 2 begins immediately.</li>'+
    '<li><b>Work as fast and as accurately as possible</b> — your time across both parts is recorded.</li>'+
    '<li>No accuracy feedback will be given.</li></ul>'+
    '<p>'+(isFirst?'First':'As before,')+', a short practice round with ordinary English words.</p>');
  await btn('Start practice');

  const pw=pracWords.map(x=>({id:x, disp:x, plain:true, play:()=>speak(x)}));
  S.practice.push({label:'practice-match-'+alpha, ...await matchTask({title:'Practice', intro:'Match each written word to its recording.', words:pw, submitLabel:'Submit practice'})});

  page('<h2>Practice complete</h2><p>The real test has <b>20 '+A.label+' words</b> in two parts of 10. Work through each part as fast and accurately as possible, then click Submit to move to the next.</p>');
  await btn('Start test');

  const items=[...A.tu.map(w=>({w,type:'untrained'})), ...A.tp.map(w=>({w,type:'practiced'}))];

  // Split into two balanced blocks of 10 (2 practiced + 8 untrained each)
  const pracShuffle=shuffle(items.filter(x=>x.type==='practiced'));
  const untShuffle=shuffle(items.filter(x=>x.type==='untrained'));
  const block1Items=shuffle([...pracShuffle.slice(0,2),...untShuffle.slice(0,8)]);
  const block2Items=shuffle([...pracShuffle.slice(2,4),...untShuffle.slice(8,16)]);
  const toWord=it=>({id:it.w, disp:A.toGlyphs(it.w).join(''), play:()=>playWordOnly(it.w)});

  const res1=await matchTask({title:A.label+' matching test — Part 1 of 2', intro:'Match each written word to its recording. Click Submit when done with this set.', words:block1Items.map(toWord), submitLabel:'Submit Part 1'});
  const res2=await matchTask({title:A.label+' matching test — Part 2 of 2', intro:'Match each written word to its recording. Click Submit when done with this set.', words:block2Items.map(toWord), submitLabel:'Submit Part 2'});

  // Merge results — offset block 2 timestamps by block 1 duration (gap excluded)
  const res={
    pairs:[...res1.pairs,...res2.pairs],
    events:[...res1.events,...res2.events.map(e=>({...e,t:e.t+res1.durationMs}))],
    plays:Object.fromEntries([...new Set([...Object.keys(res1.plays),...Object.keys(res2.plays)])].map(k=>[k,(res1.plays[k]||0)+(res2.plays[k]||0)])),
    durationMs:res1.durationMs+res2.durationMs
  };

  const per=items.map(it=>{
    const sel=res.pairs.filter(p=>p[0]===it.w).map(p=>p[1]);
    return {word:it.w, type:it.type, selectedRecordings:sel, correct:(sel.length===1&&sel[0]===it.w)};
  });
  const acc=t=>{ const a=per.filter(x=>x.type===t); return +(100*a.filter(x=>x.correct).length/a.length).toFixed(1); };
  S.test[alpha]={...res, perItem:per, pctCorrectUntrained:acc('untrained'), pctCorrectPracticed:acc('practiced')};
}

      user_agent:navigator.userAgent,
      screen_wh:screen.width+'x'+screen.height,
      window_wh:window.innerWidth+'x'+window.innerHeight,
      is_mobile:/Mobi|Android/i.test(navigator.userAgent)||navigator.maxTouchPoints>1,
      timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,
      prior_completion_detected:!!localStorage.getItem('alphabet_study_done')
    });

    await consent(); _logPhase('consent');
    await _atPatch('ExpSessions', _DL.sessionRecId, {
      consent_participate:true, consent_voice:true, consent_photo:true,
      consent_at:new Date().toISOString()
    });

    await micCheck(); _logPhase('mic_check');
    await _atPatch('ExpSessions', _DL.sessionRecId, {
      audio_check_passed:true, mic_check_passed:true,
      last_phase_completed:'mic_check'
    });

    await overview(); _logPhase('overview');
    await demoMethods(); _logPhase('demo');

    for(let pass=0; pass<2; pass++){
      const alpha=alphaOrder[pass];
      const A=getAlphaConfig(alpha);

      if(pass===1){
        const nextCond=A.cond;
        page('<h2>First alphabet complete — well done!</h2>'+
          '<p>You will now learn the second alphabet using the <b>'+(nextCond==='hand'?'handwriting':'symbol-selection')+'</b> method.</p>'+
          '<p>You may <b>uncover your paper</b> now.'+(nextCond==='hand'?' Use the same sheet to copy the new alphabet\'s symbols.':' You do not need to write anything for this alphabet — your paper can remain face-up.')+'</p>');
        await btn('Continue to second alphabet');
      }

      // Create block record before training begins
      _DL.blockRecIds[alpha] = await _atCreate('ExpBlocks', {
        session_id:_DL.sessionId,
        participant_code:S.pid,
        design:'within-subjects',
        condition:A.cond,
        alphabet:alpha,
        order_position:pass+1,
        mapping_version:A.mapVer,
        symbol_map_json:JSON.stringify(A.g),
        grid_layout_json:JSON.stringify(A.grid)
      });
      _logPhase('training_'+alpha+'_start');

      await lsTraining(alpha, A);
      await wwTraining(alpha, A);
      await coverPaper(alpha); _logPhase('cover_paper_'+alpha);

      _DL._inTest=true; _DL.testTab={count:0,ms:0,_t:null};
      await testPhase(alpha, A, pass===0);
      _DL._inTest=false;
      _logPhase('test_'+alpha+'_complete');

      // Patch block with full results
      const trials=[...(S.trials[alpha]||[])];
      const practiceEntry=S.practice.filter(p=>p.label==='practice-match-'+alpha).slice(-1)[0];
      await _atPatch('ExpBlocks', _DL.blockRecIds[alpha], {
        ..._lsStats(trials),
        ..._wwStats(trials),
        ..._practiceStats(practiceEntry),
        ..._testStats(S.test[alpha], _DL.testTab),
        letter_trials_json:JSON.stringify(trials.filter(t=>t.kind==='ls')),
        word_trials_json:JSON.stringify(trials.filter(t=>t.kind==='ww')),
        test_practice_json:JSON.stringify(practiceEntry||{}),
        demo_json:JSON.stringify(S.practice.filter(p=>p.label?.startsWith('demo')))
      });
    }

    await adherence(); _logPhase('adherence');
    await debrief(); _logPhase('debrief');
    await finish();
  }catch(e){
    page('<h2>Something went wrong</h2><p class="warn">'+e.message+'</p><p>Please contact the researcher.</p>');
    console.error(e);
  }
})();
})();
</script>
